name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 生成 release notes / 打 tag 更稳

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ✅ 计算本次要发布的 tag
      - name: Compute release tag
        id: reltag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            # 由 tag 推送触发：沿用原 tag
            $tag = $env:GITHUB_REF -replace '^refs/tags/',''
          } else {
            # 手动触发：用当前时间（UTC）生成 tag
            $tag = 'v' + (Get-Date).ToUniversalTime().ToString('yyyy.MM.dd.HHmmss')

            # 如需北京时间，把上面一行换成：
            # $now = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date), 'China Standard Time')
            # $tag = 'v' + $now.ToString('yyyy.MM.dd.HHmmss')
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag = $tag"

      - name: Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Update launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
                           -DestinationPath bmsc-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmsc-windows-${{ steps.reltag.outputs.tag }}
          path: bmsc-windows.zip

      # ✅ 始终发布 Release（tag 已在上一步算好）
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          name: ${{ steps.reltag.outputs.tag }}
          files: bmsc-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}